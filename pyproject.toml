[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudplat"
version = "0.1.0"
description = "Real-time card fraud detection platform: streaming features, ensemble scoring, explainability and a RAG investigation assistant"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "lightgbm>=4.1",
    "torch>=2.2",
    "pydantic>=2.6",
    "pyarrow>=15.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
serving = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "onnxruntime>=1.17",
]
export = [
    "onnx>=1.15",
    "onnxmltools>=1.12",
    "skl2onnx>=1.16",
    "onnxconverter-common>=1.14",
    "onnxscript>=0.1",
]
explain = ["shap>=0.44", "lime>=0.2"]
streaming = ["kafka-python>=2.0", "feast[redis,aws]>=0.36"]
genai = [
    "langchain>=0.2",
    "langchain-anthropic>=0.1",
    "langchain-core>=0.2",
    "anthropic>=0.40",
    "pinecone>=5.0",
]
pipelines = ["kfp>=2.7"]
# httpx2 (not httpx) is what starlette's TestClient imports in the version
# pinned here; installing plain httpx leaves the API tests erroring at import.
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3", "httpx2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    # SHAP announces its LightGBM return-type change on every call; the shape
    # is handled in explain/shap_explainer.py. Filtered here as well because
    # pytest resets warning filters per test and overrides the module-level one.
    "ignore:.*LightGBM binary classifier with TreeExplainer.*:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # sys.path bootstrap must precede imports
"tests/*" = ["E402"]
